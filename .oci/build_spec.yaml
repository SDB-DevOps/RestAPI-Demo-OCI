version: 0.1
component: build
timeoutInSeconds: 1800

steps:
  - type: Command
    name: Build
    description: Install Dependencies
    command: |
      sudo yum install -y python3 python3-pip docker
      pip3 install -r app/requirements.txt pytest
      python3 --version
      pip3 --version

  - type: Command
    name: Run Tests
    command: |
      pytest tests/ --cov=app --junitxml=test-results/results.xml

  - type: Command
    name: Debug Variables
    command: |
      echo "OCI_REGISTRY: ${REGISTRY}"
      echo "TENANCY_NAMESPACE: ${TENANCY_NAMESPACE}"
      echo "BUILD RUN NUMBER: ${OCI_BUILD_RUN_NUMBER}"

  - type: Command
    name: Check Docker Installation
    command: |
      docker --version
      which docker
  
  - type: Command
    name: Test Network Connectivity
    command: |
      ping -c 3 ${REGISTRY}
      curl -v https://${REGISTRY}

  - type: Command
    name: Build Docker Image
    command: |
      sudo docker build -t ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app:${OCI_BUILD_RUN_NUMBER}
      sudo docker image