version: 0.1
component: build
timeoutInSeconds: 1800

steps:
  - type: Command
    name: Build
    description: Install Dependencies
    command: |
      sudo yum install -y python3 python3-pip
      pip3 install -r app/requirements.txt
      python3 --version
      pip3 --version
  - type: Command
    name: Run Tests
    command: |
      pytest tests/ --cov=app --junitxml=test-results/results.xml
  - type: Command
    name: Build Artifact
    command: |
      mkdir -p artifact/
      cp -r app/ artifact/