version: 0.1
component: build
timeoutInSeconds: 1800

env:
  variables:
    # 源仓库配置（Container Registry）
    SOURCE_REGION: "nrt"  # 替换为你的源区域（如 iad, phx, fra 等）
    SOURCE_TENANCY_NAMESPACE: "nrcfeuv8jnfa"  # 替换为你的租户Namespace
    SOURCE_REPO_NAME: "flask-app"  # 替换为源仓库名称

    # 目标仓库配置（Artifact Registry）
    TARGET_REGION: "ap-tokyo-1"  # 替换为目标区域（如 us-ashburn-1）
    TARGET_TENANCY_NAMESPACE: "nrcfeuv8jnfa"  # 通常与源相同
    TARGET_REPO_NAME: "artifact-repository-sdb"  # 替换为目标仓库名称

    IMAGE_TAG: 1.0

    OCI_USERNAME: "rui.br.bao@ibm.com"

steps:
  - type: Command
    name: Build
    description: Install Dependencies
    command: |
      sudo yum install -y python3 python3-pip docker
      pip3 install -r app/requirements.txt pytest
      python3 --version
      pip3 --version

  - type: Command
    name: Run Tests
    command: |
      pytest tests/ --cov=app --junitxml=test-results/results.xml

  # 设置 nameserver 和获取网络信息
  - type: Command
    name: Configure DNS
    command: |
      echo "nameserver 8.8.8.8" > /etc/resolv.conf
      echo "nameserver 8.8.4.4" >> /etc/resolv.conf

  - type: Command
    name: Debug Variables
    command: |
      echo "OCI_REGISTRY: ${REGISTRY}"
      echo "TENANCY_NAMESPACE: ${TENANCY_NAMESPACE}"
      echo "BUILD RUN NUMBER: ${OCI_BUILD_RUN_NUMBER}"

  - type: Command
    name: Check Docker Installation
    command: |
      docker --version
      which docker

  - type: Command
    name: Build Docker Image
    command: |
      docker build -t ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app:latest .
      docker image

  - type: Command
    name: Push to Container Registry
    command: |
      echo $AUTH_TOKEN | docker login ${REGISTRY} -u "${TENANCY_NAMESPACE}/${USERNAME}" --password-stdin
      docker push ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app:latest

  - type: Command
    name: Pull Image from OCIR
    command: |
      # 从源仓库拉取镜像
      docker pull ${SOURCE_REGION}.ocir.io/${SOURCE_TENANCY_NAMESPACE}/flask-app:latest
      docker images | grep ${SOURCE_REPO_NAME}
    # 新增加的config DNS 
  - type: Command
    name: Configure DNS
    command: |
      echo "options timeout:1 attempts:2" >> /etc/resolv.conf
      echo "nameserver 8.8.8.8" >> /etc/resolv.conf

  - type: Command
    name: Login to Artifact Registry
    command: |
      echo $AUTH_TOKEN | docker login \
        nrt.artifacts.ap-tokyo-1.oci.oraclecloud.com \
        -u "nrcfeuv8jnfa/rui.br.bao@ibm.com" \
        --password-stdin


  - type: Command
    name: Retag Image for Artifact Registry
    command: |
      # 重打标签（指向Artifact Registry）
      # docker tag flask-app:latest ${SOURCE_REGION}.ocir.io/${SOURCE_TENANCY_NAMESPACE}/${TARGET_REPO_NAME}/flask-app:latest
      docker tag \
        ${SOURCE_REGION}.ocir.io/${SOURCE_TENANCY_NAMESPACE}/flask-app:latest \
        ${SOURCE_REGION}.artifacts.ap-tokyo-1.oci.oraclecloud.com/${SOURCE_TENANCY_NAMESPACE}/${TARGET_REPO_NAME}:latest
      # "${SOURCE_REGION}.artifacts.ap-tokyo-1.oci.oraclecloud.com/${SOURCE_TENANCY_NAMESPACE}/flask-app:latest"

  - type: Command
    name: Verify Tag
    command: |
      docker images | grep "flask-app"

  - type: Command
    name: Push Image to Artifact Registry
    command: |
      # 推送镜像到目标仓库
      # docker push ${SOURCE_REGION}.ocir.io/${SOURCE_TENANCY_NAMESPACE}/${TARGET_REPO_NAME}/flask-app:latest
        docker push ${SOURCE_REGION}.artifacts.ap-tokyo-1.oci.oraclecloud.com/${SOURCE_TENANCY_NAMESPACE}/${TARGET_REPO_NAME}:latest
        
outputArtifacts:
  - name: artifact-repository-sdb
    type: DOCKER_IMAGE
    location: nrt.ocir.io/nrcfeuv8jnfa/${TARGET_REPO_NAME}/flask-app:latest
  


