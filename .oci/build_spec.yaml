version: 0.1
component: build
timeoutInSeconds: 3600
runAs: root

steps:
  - type: Command
    name: Build
    description: Install Dependencies
    command: |
      sudo yum install -y python3 python3-pip docker
      pip3 install -r app/requirements.txt pytest
      python3 --version
      pip3 --version
      sudo yum install -y python3-oci-cli
      oci --version
  
  - type: Command
    name: Run Tests
    command: |
      pytest tests/ --cov=app --junitxml=test-results/results.xml

  - type: Command
    name: Check Docker Installation
    command: |
      docker --version
      which docker

  - type: Command
    name: Build Docker Image
    command: |
      docker build -t ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app-python:latest .
    timeoutInSeconds: 1800

  - type: Command
    name: Push to Container Registry
    command: |
      echo $AUTH_TOKEN | docker login ${REGISTRY} -u "${TENANCY_NAMESPACE}/${USERNAME}" --password-stdin
      docker push ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app-python:latest

  - type: Command
    name: Pull Image from OCIR
    command: |
      # 从源仓库拉取镜像
      docker pull ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app-python:latest
      docker images | grep flask-app-python

  - type: Command
    name: Save Image
    command: |
      docker save -o flask-app-image.tar ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app-python:latest
      echo $?
      ls -lh flask-app-image.tar
      file flask-app-image.tar
      
  - type: Command
    name: Upload Image to Artifact Registry
    command: |    
      # oci artifacts generic artifact upload \
      #   --compartment-id ocid1.tenancy.oc1..aaaaaaaalf3yetsmgmcmw2ifiscdsfs5hql22ajrelsadp3uypkc7pag4hra \
      #   --repository-id ocid1.artifactrepository.oc1.ap-tokyo-1.0.amaaaaaa5w4457ian6bqbuyo7vj2ujyxwxceruuhwwov73cflf625xqy3kjq \
      #   --display-name "flask-app" \
      #   --artifact-path flask-app-image.tar \
      #   --version "1.0.0"

      # LOCAL_FILE="$(pwd)/flask-app-image.tar"
      # echo "本地文件路径: $LOCAL_FILE"

      # 2. 使用官方推荐命令上传
      oci artifacts generic artifact upload-by-path \
        --repository-id ocid1.artifactrepository.oc1.ap-tokyo-1.0.amaaaaaa5w4457ian6bqbuyo7vj2ujyxwxceruuhwwov73cflf625xqy3kjq \
        --artifact-path "docker-images-666" \
        --artifact-version "1.0.6" \  # 时间戳确保版本唯一
        --content-body "/workspace/SDB_TestDemo/flask-app-image.tar"
      oci artifacts generic artifact upload-by-path -h
      
      # # 3. 验证结果
      # oci artifacts generic artifact list \
