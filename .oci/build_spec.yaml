version: 0.1
component: build
timeoutInSeconds: 1800

env:
  variables:
    # 源仓库配置（Container Registry）
    SOURCE_REGION: "nrt"  # 替换为你的源区域（如 iad, phx, fra 等）
    SOURCE_TENANCY_NAMESPACE: "nrcfeuv8jnfa"  # 替换为你的租户Namespace
    SOURCE_REPO_NAME: "flask-app"  # 替换为源仓库名称
    SOURCE_IMAGE_TAG: "v0.1"  # 替换为镜像标签

    # 目标仓库配置（Artifact Registry）
    TARGET_REGION: "ap-tokyo-1"  # 替换为目标区域（如 us-ashburn-1）
    TARGET_TENANCY_NAMESPACE: "nrcfeuv8jnfa"  # 通常与源相同
    TARGET_REPO_NAME: "artifact-repository-sdb"  # 替换为目标仓库名称

    OCI_USERNAME: "rui.br.bao@ibm.com"

steps:
  - type: Command
    name: Build
    description: Install Dependencies
    command: |
      sudo yum install -y python3 python3-pip docker
      pip3 install -r app/requirements.txt pytest
      python3 --version
      pip3 --version

  - type: Command
    name: Run Tests
    command: |
      pytest tests/ --cov=app --junitxml=test-results/results.xml

  - type: Command
    name: Debug Variables
    command: |
      echo "OCI_REGISTRY: ${REGISTRY}"
      echo "TENANCY_NAMESPACE: ${TENANCY_NAMESPACE}"
      echo "BUILD RUN NUMBER: ${OCI_BUILD_RUN_NUMBER}"

  - type: Command
    name: Check Docker Installation
    command: |
      docker --version
      which docker

  - type: Command
    name: Build Docker Image
    command: |
      docker build -t ${REGISTRY}/${TENANCY_NAMESPACE}/${SOURCE_REPO_NAME}:${SOURCE_IMAGE_TAG} .
      docker image

  - type: Command
    name: Push to Container Registry
    command: |
      echo $AUTH_TOKEN | docker login ${REGISTRY} -u "${TENANCY_NAMESPACE}/${USERNAME}" --password-stdin
      docker push ${REGISTRY}/${TENANCY_NAMESPACE}/${SOURCE_REPO_NAME}:${SOURCE_IMAGE_TAG}

  - type: Command
    name: Pull Image from OCIR
    command: |
      # 从源仓库拉取镜像
      docker pull ${SOURCE_REGION}.ocir.io/${SOURCE_TENANCY_NAMESPACE}/${SOURCE_REPO_NAME}:${SOURCE_IMAGE_TAG}
      docker images | grep ${SOURCE_REPO_NAME}

  - type: Command
    name: Retag Image for Artifact Registry
    command: |
      # 重打标签（指向Artifact Registry）
      docker tag \
        ${SOURCE_REGION}.ocir.io/${SOURCE_TENANCY_NAMESPACE}/${SOURCE_REPO_NAME}:${SOURCE_IMAGE_TAG} \
        ${SOURCE_REGION}.artifacts.${TARGET_REGION}.oci.oraclecloud.com/${TARGET_TENANCY_NAMESPACE}/${TARGET_REPO_NAME}:${SOURCE_IMAGE_TAG}


  - type: Command
    name: Push Image to Artifact Registry
    command: |
      # 推送镜像到目标仓库
      docker push ${SOURCE_REGION}.artifacts.${TARGET_REGION}.oci.oraclecloud.com/${TARGET_TENANCY_NAMESPACE}/${TARGET_REPO_NAME}:${SOURCE_IMAGE_TAG}

outputArtifacts:
  - name: artifact-repository-sdb
    type: DOCKER_IMAGE
    location: nrt.ocir.io/nrcfeuv8jnfa/flask-app:latest
  


