version: 0.1
component: build
timeoutInSeconds: 1800

env:
  variables:
    PYTHON_VERSION: "3.13"

steps:
  - type: Command
    name: Install Python
    command: |-
      sudo apt-get update
      sudo apt-get install -y python${PYTHON_VERSION} python${PYTHON_VERSION}-dev python3-pip
      python${PYTHON_VERSION} -m pip install --upgrade pip
    when:
      branch:
        equals:
          - main
          - develop
  - type: Command
    name: Install Dependencies
    command: |-
      python${PYTHON_VERSION} -m pip install -r app/requirements.txt
  - type: Command
    name: Package Application
    command: |-
      mkdir -p artifacts
      cp -r . artifacts/

outputArtifacts:
  - name: flask_app_latest_image
    type: zip