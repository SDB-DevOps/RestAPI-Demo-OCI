version: 0.1
component: build
timeoutInSeconds: 3600
runAs: root

steps:
  - type: Command
    name: Build
    description: Install Dependencies
    command: |
      sudo yum install -y python3 python3-pip docker
      pip3 install -r app/requirements.txt pytest
      python3 --version
      pip3 --version

  - type: Command
    name: Run Tests
    command: |
      pytest tests/ --cov=app --junitxml=test-results/results.xml

  - type: Command
    name: Check Docker Installation
    command: |
      docker --version
      which docker

  - type: Command
    name: Build Docker Image
    command: |
      docker build -t ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app-python:latest .
    timeoutInSeconds: 1800

  - type: Command
    name: Push to Container Registry
    command: |
      echo $AUTH_TOKEN | docker login ${REGISTRY} -u "${TENANCY_NAMESPACE}/${USERNAME}" --password-stdin
      docker push ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app-python:latest

  - type: Command
    name: Pull Image from OCIR
    command: |
      # 从源仓库拉取镜像
      docker pull ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app-python:latest
      docker images | grep flask-app-python

  - type: Command
    name: Save Image
    command: |
      docker save -o flask-app-image.tar ${REGISTRY}/${TENANCY_NAMESPACE}/flask-app-python:latest
      echo $?
      ls -lh flask-app-image.tar
      file flask-app-image.tar

